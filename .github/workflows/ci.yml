name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # An advisory can be published against a dependency that has not changed,
    # so a tree that passed on merge is vulnerable days later with nothing
    # pushed to retrigger CI. The daily run rechecks it.
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    # The daily schedule only re-audits an unchanged tree, so the cron run
    # skips this job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libheif-dev libdav1d-dev clang libclang-dev libasound2-dev
          ffmpeg_url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=20" \
            | grep -oE '"browser_download_url": *"[^"]*linux64-gpl-shared-9\.0\.tar\.xz"' \
            | grep -oE 'https://[^"]*' | head -n1)
          if [ -z "$ffmpeg_url" ]; then
            echo "::error::could not resolve an n9.0 gpl-shared FFmpeg build" >&2
            exit 1
          fi
          echo "Downloading $ffmpeg_url"
          curl -fL -o /tmp/ffmpeg.tar.xz "$ffmpeg_url"
          mkdir -p "$HOME/ffmpeg"
          tar -xf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          sed -i "s|^prefix=.*|prefix=$HOME/ffmpeg|" "$HOME/ffmpeg/lib/pkgconfig/"*.pc
          echo "FFMPEG_DIR=$HOME/ffmpeg" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --features heif,av -- -D warnings

      - name: test
        run: cargo test --features heif,av

      # The GPU-backed tests (pipeline goldens, per-pass comparisons) skip when
      # no adapter is present, so the step above cannot prove they ran. lavapipe
      # gives the runner a software Vulkan device; BLOOM_REQUIRE_GPU=1 then turns
      # a missing adapter into a failure instead of a silent skip.
      - name: Install software GPU (lavapipe)
        run: sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      - name: test (GPU paths)
        env:
          BLOOM_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
        run: "cargo test --features heif,av wgpu::"

  cross:
    name: Check ${{ matrix.name }}
    # Nothing here inspects dependencies, so the nightly advisory run skips it.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # The lint job builds and tests on Linux with heif and av. This one only
      # answers whether the other two platforms still compile, which is what
      # release.yml would otherwise discover at tag time. Default features need
      # no libheif, dav1d or FFmpeg, so these runners install nothing. The av
      # and heif paths stay uncovered here and are first built at release.
      - name: cargo check
        run: cargo check --all-targets

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # cargo-audit reads Cargo.lock and queries the RustSec database. It never
      # compiles the crate, so this job skips the libheif, dav1d and FFmpeg
      # install that the lint job needs.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Bare `cargo audit` exits 1 on a vulnerability and exits 0 on
      # unmaintained or yanked crates, which it prints as allowed warnings.
      # Several of those warnings are transitive with no upgrade available, so
      # failing on them would leave this job red every run.
      #
      # RUSTSEC-2026-0151 (jxl-grid out-of-bounds write) is ignored because the
      # only path to it is dicom-transfer-syntax-registry pinning an old
      # jxl-oxide; our own jxl-oxide is on the patched jxl-grid. The overflow is
      # reachable on 32-bit targets and every artifact we ship is 64-bit.
      # Removing the ignore needs a semver-major bump to dicom 0.10.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0151
